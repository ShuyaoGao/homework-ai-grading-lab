key: english_essay_gaokao
name: 高考英语书面表达（应用文写作，满分15分）
subject: english
kind: essay_en
version: "2026.1"
max_score: 15
source: >
  参照新高考英语卷“应用文写作”常见评分原则（五档制，先定档后调分）整理，
  并非官方原文；各省/各次考试评分细则不同，教师可在“量规管理”中复制后修改。
description: >
  评分时主要考虑：内容要点的覆盖情况、应用词汇和语法结构的数量和准确性、
  上下文的衔接和全文的连贯性。拼写与标点符号是语言准确性的一个方面，
  评分时应视其对交际的影响程度予以考虑；英、美拼写及词汇用法均可接受。
scoring_method: >
  先根据文章的内容和语言初步确定其所属档次，然后以该档次的要求来衡量，
  确定或调整档次，最后给分。为便于复核，本系统同时给出三个分项分，
  分项分之和即总分，总分应落在所定档次的分数区间内。
bands:
  - {name: 第五档, min: 13, max: 15, descriptor: 完全完成试题规定的任务；覆盖所有内容要点；应用了较多的语法结构和词汇，有些许错误但为使用较复杂结构或较高级词汇所致；有效地使用了语句间的连接成分，全文结构紧凑。}
  - {name: 第四档, min: 10, max: 12, descriptor: 完全完成试题规定的任务；虽漏掉1、2个次重点，但覆盖所有主要内容；应用的语法结构和词汇能满足任务的要求；语法结构或词汇方面应用基本准确，些许错误主要是因尝试较复杂语法结构或词汇所致；应用简单的语句间的连接成分，使全文结构紧凑。}
  - {name: 第三档, min: 7, max: 9, descriptor: 基本完成了试题规定的任务；虽漏掉一些内容，但覆盖所有主要内容；应用的语法结构和词汇能满足任务的要求；有一些语法结构或词汇方面的错误，但不影响理解；应用简单的语句间的连接成分，使全文内容连贯。}
  - {name: 第二档, min: 4, max: 6, descriptor: 未恰当完成试题规定的任务；漏掉或未描述清楚一些主要内容，写了一些无关内容；语法结构单调、词汇项目有限；有一些语法结构或词汇方面的错误，影响了对写作内容的理解；较少使用语句间的连接成分，内容缺少连贯性。}
  - {name: 第一档, min: 0, max: 3, descriptor: 未完成试题规定的任务；明显遗漏主要内容，写了一些无关内容，原因可能是未理解试题要求；语法结构单调、词汇项目很有限；较多语法结构或词汇方面的错误，影响对写作内容的理解；缺乏语句间的连接成分，内容不连贯。未作答或内容与题目要求完全不相关者得0分。}
criteria:
  - id: content
    name: 内容要点
    max: 6
    dimension: content
    descriptor: 是否完成交际任务、覆盖题目规定的全部要点、切题，信息是否清楚。
    levels:
      - {name: 优, min: 5, max: 6, text: 要点齐全且有适当发挥}
      - {name: 中, min: 3, max: 4, text: 主要要点齐全，个别次要点缺失}
      - {name: 差, min: 0, max: 2, text: 遗漏主要要点或偏题}
  - id: language
    name: 语言运用
    max: 6
    dimension: language
    descriptor: 词汇与语法结构的丰富性和准确性；拼写、大小写、标点按对交际的影响程度考虑。
    levels:
      - {name: 优, min: 5, max: 6, text: 结构多样、用词准确，错误极少}
      - {name: 中, min: 3, max: 4, text: 能满足任务要求，有错误但不影响理解}
      - {name: 差, min: 0, max: 2, text: 错误较多，影响理解}
  - id: organization
    name: 篇章结构
    max: 3
    dimension: organization
    descriptor: 语句间连接成分的使用、段落安排、应用文格式（称呼、落款等）、全文连贯。
    levels:
      - {name: 优, min: 3, max: 3, text: 衔接自然，格式规范}
      - {name: 中, min: 2, max: 2, text: 基本连贯}
      - {name: 差, min: 0, max: 1, text: 缺乏连接，结构松散}
deductions:
  - {id: word_count, name: 词数不足, rule: 词数明显少于题目要求（低于要求的 75%）时酌情从总分中扣分, per_item: 2, max: 2}
review_policy:
  confidence_below: 0.7
  near_band_boundary: 0.5
  low_score_ratio: 0.4
heuristic:
  target_words: [80, 100]
